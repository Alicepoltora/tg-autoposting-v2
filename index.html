<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <title>Bot Manager Pro</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0a0a0f;
      --card-bg: rgba(20, 20, 30, 0.8);
      --accent: #8b5cf6;
      --secondary: #f59e0b;
      --text: #ffffff;
      --text-dim: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
      --success: #10b981;
      --danger: #ef4444;
    }

    body {
      background: var(--bg-color);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    #root {
      width: 100%;
      max-width: 500px;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 28px;
      margin: 0 0 8px 0;
      background: linear-gradient(to right, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-active {
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
    }

    .status-inactive {
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger);
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 16px;
      color: white;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: var(--accent);
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 12px 20px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:active {
      transform: scale(0.95);
      opacity: 0.9;
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-dim);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      padding: 12px 16px;
      border-radius: 16px;
      border: 1px solid transparent;
    }

    .item:hover {
      border-color: var(--border);
    }

    .rule-item {
      flex-direction: column;
      align-items: flex-start;
    }

    .rule-header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 4px;
    }

    code {
      color: var(--secondary);
      font-family: monospace;
    }

    .footer-action {
      position: sticky;
      bottom: 20px;
      margin-top: 40px;
    }

    .save-btn {
      width: 100%;
      padding: 18px;
      font-size: 16px;
      justify-content: center;
      box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3);
    }

    .loader {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s infinite linear;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const App = () => {
      const [config, setConfig] = useState(null);
      const [status, setStatus] = useState('checking...');
      const [newSource, setNewSource] = useState('');
      const [saving, setSaving] = useState(false);
      const [restarting, setRestarting] = useState(false);

      const API = ""; // Backend works on same host/port in this setup

      useEffect(() => {
        fetchData();
      }, []);

      const fetchData = async () => {
        try {
          const [conf, stat] = await Promise.all([
            axios.get('/config'),
            axios.get('/status')
          ]);
          setConfig(conf.data);
          setStatus(stat.data.status);
        } catch (e) {
          console.error(e);
          setStatus('offline');
        }
      };

      const saveConfig = async () => {
        setSaving(true);
        try {
          await axios.post('/config', config);
          await axios.post('/restart');
          setRestarting(true);
          setTimeout(() => {
            setRestarting(false);
            setSaving(false);
            fetchData();
          }, 3000);
        } catch (e) {
          alert('Ошибка сохранения');
          setSaving(false);
        }
      };

      if (!config) return <div style={{ display: 'flex', justifyContent: 'center', marginTop: '100px' }}><div className="loader"></div></div>;

      return (
        <div>
          <header className="glass-card" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div>
              <h1>Iranium Pro</h1>
              <div className={`status-badge ${status === 'active' ? 'status-active' : 'status-inactive'}`}>
                <div style={{ width: 8, height: 8, background: 'currentColor', borderRadius: '50%' }}></div>
                {status.toUpperCase()}
              </div>
            </div>
            <button className="btn-ghost" onClick={fetchData}>
              <i data-lucide="refresh-cw" className={restarting ? 'loader' : ''}></i>
            </button>
          </header>

          <div className="glass-card">
            <h3>Источники</h3>
            <div className="input-group">
              <input
                placeholder="@channel"
                value={newSource}
                onChange={e => setNewSource(e.target.value)}
              />
              <button className="btn-primary" onClick={() => {
                if (!newSource) return;
                setConfig({ ...config, sources: [...config.sources, newSource] });
                setNewSource('');
                setTimeout(() => lucide.createIcons(), 10);
              }}>
                <i data-lucide="plus"></i>
              </button>
            </div>
            <div className="item-list">
              {config.sources.map((src, i) => (
                <div className="item" key={i}>
                  <span>{src}</span>
                  <button className="btn-ghost" style={{ color: 'var(--danger)' }} onClick={() => {
                    setConfig({ ...config, sources: config.sources.filter((_, idx) => idx !== i) });
                  }}>
                    <i data-lucide="trash-2"></i>
                  </button>
                </div>
              ))}
            </div>
          </div>

          <div className="glass-card">
            <h3>Правила очистки</h3>
            <div className="item-list">
              {config.cleaning_rules.map((rule, i) => (
                <div className="item rule-item" key={i}>
                  <div className="rule-header">
                    <code>{rule.pattern}</code>
                    <button className="btn-ghost" style={{ color: 'var(--danger)' }} onClick={() => {
                      const rules = [...config.cleaning_rules];
                      rules.splice(i, 1);
                      setConfig({ ...config, cleaning_rules: rules });
                    }}>
                      <i data-lucide="trash-2"></i>
                    </button>
                  </div>
                  <span style={{ fontSize: '13px', color: 'var(--text-dim)' }}>
                    → {rule.replacement || '[удаляется]'}
                  </span>
                </div>
              ))}
            </div>
            <button className="btn-ghost" style={{ width: '100%', marginTop: '12px', color: 'var(--accent)' }} onClick={() => {
              const p = prompt('Регулярное выражение (Pattern):');
              if (!p) return;
              const r = prompt('На что заменить (Replacement):', '');
              setConfig({ ...config, cleaning_rules: [...config.cleaning_rules, { pattern: p, replacement: r }] });
              setTimeout(() => lucide.createIcons(), 10);
            }}>
              Добавить правило
            </button>
          </div>

          <div className="footer-action">
            <button className="btn-primary save-btn" onClick={saveConfig} disabled={saving}>
              {saving ? <div className="loader"></div> : <><i data-lucide="save"></i> Сохранить и применить</>}
            </button>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // Initial icons load
    setTimeout(() => lucide.createIcons(), 100);
  </script>
</body>

</html>
